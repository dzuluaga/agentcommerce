<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <rect x="4" y="4" width="192" height="192" rx="16" ry="16" fill="#1e293b"/>
  <!-- Yoga mat (rolled up, perspective view) -->
  <g stroke="#22c55e" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Rolled mat - spiral end (left side) -->
    <ellipse cx="55" cy="95" rx="28" ry="35"/>
    <!-- Inner spiral -->
    <path d="M55 68 Q42 68 42 80 Q42 95 55 95"/>
    <path d="M55 95 Q65 95 65 84 Q65 75 55 75"/>
    <path d="M55 75 Q49 75 49 82 Q49 90 55 90"/>
    <path d="M55 90 Q59 90 59 86 Q59 82 55 82"/>
    <!-- Center dot -->
    <circle cx="55" cy="86" r="2"/>
    <!-- Mat body extending to right -->
    <line x1="55" y1="60" x2="155" y2="60"/>
    <line x1="55" y1="130" x2="155" y2="130"/>
    <!-- Rolled end on right (partial) -->
    <path d="M155 60 Q168 60 168 72 L168 118 Q168 130 155 130"/>
    <!-- Mat texture lines -->
    <line x1="90" y1="60" x2="90" y2="130" stroke-dasharray="6 4" stroke-width="1.5"/>
    <line x1="120" y1="60" x2="120" y2="130" stroke-dasharray="6 4" stroke-width="1.5"/>
    <!-- Carrying strap -->
    <path d="M75 58 Q75 40 100 38 Q125 40 125 58" stroke-width="2"/>
  </g>
  <text x="100" y="170" text-anchor="middle" fill="#94a3b8" font-family="system-ui, sans-serif" font-size="12" font-weight="500">Manduka Mat</text>
</svg>